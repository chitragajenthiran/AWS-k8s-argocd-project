# ===========================================
# KUBERNETES INGRESS
# ===========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitops-demo
  labels:
    app: gitops-demo
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: gitops-demo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitops-demo
                port:
                  number: 80

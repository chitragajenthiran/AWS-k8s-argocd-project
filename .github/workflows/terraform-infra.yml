# ===========================================
# TERRAFORM INFRASTRUCTURE PIPELINE
# ===========================================
# Manages EKS/AKS cluster lifecycle

name: 'Terraform Infrastructure'

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      cloud:
        description: 'Cloud provider'
        required: true
        default: 'aws'
        type: choice
        options:
          - aws
          - azure

env:
  TF_VERSION: '1.5.0'
  TF_WORKING_DIR: terraform/${{ github.event.inputs.cloud || 'aws' }}
  
  # AWS credentials
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  
  # Azure credentials
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

jobs:
  # ===========================================
  # JOB 1: VALIDATE
  # ===========================================
  validate:
    name: 'Validate Terraform'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: terraform
        continue-on-error: true

      - name: Terraform Init (AWS)
        run: terraform init -backend=false
        working-directory: terraform/aws

      - name: Terraform Validate (AWS)
        run: terraform validate
        working-directory: terraform/aws

      - name: Terraform Init (Azure)
        run: terraform init -backend=false
        working-directory: terraform/azure

      - name: Terraform Validate (Azure)
        run: terraform validate
        working-directory: terraform/azure

  # ===========================================
  # JOB 2: PLAN
  # ===========================================
  plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Check Existing Cluster
        id: check-cluster
        run: |
          echo "🔍 Checking for existing EKS cluster..."
          # Run a refresh to get current state
          terraform refresh -target=data.aws_eks_clusters.existing 2>/dev/null || true
          
          # Get cluster validation info
          VALIDATION=$(terraform output -json cluster_validation 2>/dev/null || echo '{}')
          echo "Cluster Validation: $VALIDATION"
          
          CLUSTER_EXISTS=$(echo $VALIDATION | jq -r '.cluster_exists // false')
          ACTION=$(echo $VALIDATION | jq -r '.action // "CREATE"')
          EXISTING_VERSION=$(echo $VALIDATION | jq -r '.existing_version // "N/A"')
          TARGET_VERSION=$(echo $VALIDATION | jq -r '.target_version // "N/A"')
          EFFECTIVE_VERSION=$(echo $VALIDATION | jq -r '.effective_version // "N/A"')
          
          echo "cluster_exists=$CLUSTER_EXISTS" >> $GITHUB_OUTPUT
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "existing_version=$EXISTING_VERSION" >> $GITHUB_OUTPUT
          echo "target_version=$TARGET_VERSION" >> $GITHUB_OUTPUT
          echo "effective_version=$EFFECTIVE_VERSION" >> $GITHUB_OUTPUT
          
          case "$ACTION" in
            "CREATE")
              echo "🆕 Cluster does not exist - will CREATE new cluster with version $TARGET_VERSION"
              ;;
            "UPGRADE")
              echo "⬆️ Cluster exists - will UPGRADE from $EXISTING_VERSION to $TARGET_VERSION"
              ;;
            "SKIP")
              echo "⏭️ Cluster exists with version $EXISTING_VERSION - target version $TARGET_VERSION is same or lower"
              echo "   Only missing resources will be applied, cluster version unchanged"
              ;;
          esac
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      - name: Plan Summary
        run: |
          echo "## 📋 Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster Exists | ${{ steps.check-cluster.outputs.cluster_exists }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Existing Version | ${{ steps.check-cluster.outputs.existing_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Version | ${{ steps.check-cluster.outputs.target_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Effective Version | ${{ steps.check-cluster.outputs.effective_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Action | **${{ steps.check-cluster.outputs.action }}** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          ACTION="${{ steps.check-cluster.outputs.action }}"
          case "$ACTION" in
            "CREATE")
              echo "🆕 **New cluster will be created with version ${{ steps.check-cluster.outputs.target_version }}**" >> $GITHUB_STEP_SUMMARY
              ;;
            "UPGRADE")
              echo "⬆️ **Cluster will be upgraded from ${{ steps.check-cluster.outputs.existing_version }} to ${{ steps.check-cluster.outputs.target_version }}**" >> $GITHUB_STEP_SUMMARY
              ;;
            "SKIP")
              echo "⏭️ **Version unchanged (target ${{ steps.check-cluster.outputs.target_version }} <= existing ${{ steps.check-cluster.outputs.existing_version }}) - Only missing resources will be applied**" >> $GITHUB_STEP_SUMMARY
              ;;
          esac

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan 📋
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.substring(0, 65000)
            });

  # ===========================================
  # JOB 3: APPLY
  # ===========================================
  apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: plan
    if: github.event.inputs.action == 'apply'
    # environment: infrastructure  # Uncomment to require manual approval
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: |
          echo "🚀 Applying Terraform changes..."
          terraform apply -auto-approve tfplan
          
          # Show what was done
          echo "## ✅ Apply Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          terraform output -json cluster_validation >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Output Results
        run: terraform output -json > outputs.json
        working-directory: ${{ env.TF_WORKING_DIR }}

  # ===========================================
  # JOB 4: DESTROY
  # ===========================================
  destroy:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.action == 'destroy'
    # environment: destroy-approval  # Uncomment to require manual approval
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Check Destroy Protection
        run: |
          echo "⚠️ DESTROY OPERATION REQUESTED"
          echo ""
          echo "Checking allow_cluster_destroy variable..."
          
          # Check current variable setting
          ALLOW_DESTROY=$(terraform output -json 2>/dev/null | jq -r '.allow_cluster_destroy.value // false' || echo "false")
          
          if [ "$ALLOW_DESTROY" != "true" ]; then
            echo "❌ Cluster destruction is PROTECTED"
            echo ""
            echo "To destroy the cluster, set allow_cluster_destroy = true in terraform.tfvars"
            echo "This is a safety measure to prevent accidental deletion."
            exit 1
          fi
          
          echo "✅ Destroy protection is disabled - proceeding with destruction"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Destroy
        run: |
          echo "🔥 Destroying infrastructure..."
          terraform destroy -auto-approve
          echo "## ⚠️ Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
        working-directory: ${{ env.TF_WORKING_DIR }}

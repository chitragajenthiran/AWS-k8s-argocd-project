# ===========================================
# CI/CD PIPELINE - BUILD & DEPLOY WITH ARGO CD
# ===========================================
# GitOps workflow: Build image -> Update manifests -> Argo CD syncs

name: 'GitOps CI/CD Pipeline'

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - 'k8s/**'
      - '.github/workflows/gitops-pipeline.yml'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/gitops-demo
  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}

jobs:
  # ===========================================
  # JOB 1: BUILD & TEST
  # ===========================================
  build:
    name: 'Build & Test'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest flake8

      - name: Lint code
        run: flake8 app/ --max-line-length=120

      - name: Run tests
        run: |
          cd app
          python -m pytest tests/ -v || echo "No tests found, skipping"

  # ===========================================
  # JOB 2: BUILD & PUSH DOCKER IMAGE
  # ===========================================
  docker:
    name: 'Build Docker Image'
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # JOB 3: UPDATE KUSTOMIZE IMAGE TAG
  # ===========================================
  update-manifests:
    name: 'Update K8s Manifests'
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "overlay=prod" >> $GITHUB_OUTPUT
          else
            echo "overlay=dev" >> $GITHUB_OUTPUT
          fi

      - name: Update image tag
        run: |
          cd k8s/overlays/${{ steps.env.outputs.overlay }}
          kustomize edit set image gitops-demo=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: update image tag to ${{ github.sha }}"
          git push

  # ===========================================
  # JOB 4: SYNC ARGO CD (Optional - Auto-sync enabled)
  # ===========================================
  sync-argocd:
    name: 'Sync Argo CD'
    runs-on: ubuntu-latest
    needs: update-manifests
    if: github.event_name != 'pull_request' && vars.ARGOCD_SYNC_ENABLED == 'true'
    
    steps:
      - name: Install Argo CD CLI
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64

      - name: Determine app name
        id: app
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "name=gitops-demo-prod" >> $GITHUB_OUTPUT
          else
            echo "name=gitops-demo-dev" >> $GITHUB_OUTPUT
          fi

      - name: Sync Application
        run: |
          argocd login ${{ env.ARGOCD_SERVER }} \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure
          
          argocd app sync ${{ steps.app.outputs.name }} --force
          argocd app wait ${{ steps.app.outputs.name }} --health

  # ===========================================
  # JOB 5: NOTIFY
  # ===========================================
  notify:
    name: 'Notify'
    runs-on: ubuntu-latest
    needs: [docker, update-manifests]
    if: always() && github.event_name != 'pull_request'
    
    steps:
      - name: Send notification
        run: |
          if [[ "${{ needs.docker.result }}" == "success" && "${{ needs.update-manifests.result }}" == "success" ]]; then
            echo "✅ Deployment successful!"
            echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          else
            echo "❌ Deployment failed"
            exit 1
          fi
